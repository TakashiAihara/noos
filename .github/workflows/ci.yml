name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Suru packages
        run: bun run --filter '@noos/suru-types' --filter '@noos/suru-utils' build

      - name: Run lint check (Suru only)
        run: bunx biome lint apps/suru packages/suru

      - name: Run format check (Suru only)
        run: bunx biome format apps/suru packages/suru

      - name: Run type check (Suru packages only)
        run: bun run --filter '@noos/suru-*' typecheck
